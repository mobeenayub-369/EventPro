<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventPro - {% block title %}Event Management{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom CSS -->
    <link href="/static/css/main.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation Bar (Fiverr Style - Blue Theme) -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="{% url 'home' %}">
                <i class="fas fa-calendar-alt me-2"></i>EventPro
            </a>

            <!-- Search Bar in Navigation (Fiverr Style) -->
            <div class="d-none d-lg-flex mx-4" style="flex: 0 1 500px;">
                <div class="input-group">
                    <input type="text" class="form-control border-end-0" placeholder="Find photographers, caterers, decorators...">
                    <button class="btn btn-primary" type="button">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>

            <div class="navbar-nav ms-auto align-items-center">
                <a class="nav-link mx-2" href="{% url 'services' %}">
                    <i class="fas fa-th-large me-1"></i>Browse
                </a>
                {% if user.is_authenticated %}
                    <a class="nav-link mx-2" href="{% url 'wishlist' %}">
                        <i class="far fa-heart"></i>
                    </a>
                    <a class="nav-link mx-2" href="{% url 'messaging' %}">
                        <i class="far fa-envelope"></i>
                    </a>
                    <a class="nav-link mx-2" href="{% url 'dashboard' %}">
                        <i class="far fa-user"></i>
                    </a>
                {% else %}
                    <a class="nav-link mx-2" href="{% url 'login' %}">Sign In</a>
                    <a class="btn btn-primary mx-2" href="{% url 'register' %}">Join</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer (Fiverr Style) -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-4">
                    <h5 class="fw-bold">EventPro</h5>
                    <p>Your trusted event management platform</p>
                </div>
                <div class="col-md-2">
                    <h6>Categories</h6>
                    <ul class="list-unstyled">
                        <li><a href="#" class="text-light text-decoration-none">Photography</a></li>
                        <li><a href="#" class="text-light text-decoration-none">Catering</a></li>
                        <li><a href="#" class="text-light text-decoration-none">Decoration</a></li>
                    </ul>
                </div>
                <div class="col-md-2">
                    <h6>Support</h6>
                    <ul class="list-unstyled">
                        <li><a href="#" class="text-light text-decoration-none">Help & Support</a></li>
                        <li><a href="#" class="text-light text-decoration-none">Contact Us</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
