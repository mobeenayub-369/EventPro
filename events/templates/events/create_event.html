<!-- Multiple Event Images -->
<div class="form-section mb-4">
    <h5 class="section-title">Event Images</h5>
    <p class="text-muted mb-3">Upload at least 3 images to showcase your event organization skills</p>

    <!-- Primary Image -->
    <div class="mb-3">
        <label class="form-label fw-bold">Primary Image *</label>
        <input type="file" class="form-control" name="primary_image" accept="image/*" required>
        <div class="form-text">This will be the main display image for your event</div>
    </div>

    <!-- Additional Images -->
    <div class="mb-3">
        <label class="form-label fw-bold">Additional Images (2+ recommended)</label>
        <input type="file" class="form-control" name="image_2" accept="image/*">
        <input type="file" class="form-control mt-2" name="image_3" accept="image/*">
        <input type="file" class="form-control mt-2" name="image_4" accept="image/*">
        <div class="form-text">Show different aspects of your event organization</div>
    </div>

    <!-- Image Preview Gallery -->
    <div class="image-previews row g-2 mt-3" style="display: none;">
        <div class="col-3">
            <div class="image-preview-card">
                <img id="previewPrimary" class="preview-img">
                <small class="preview-label">Primary</small>
            </div>
        </div>
        <div class="col-3">
            <div class="image-preview-card">
                <img id="previewImage2" class="preview-img">
                <small class="preview-label">Image 2</small>
            </div>
        </div>
        <div class="col-3">
            <div class="image-preview-card">
                <img id="previewImage3" class="preview-img">
                <small class="preview-label">Image 3</small>
            </div>
        </div>
        <div class="col-3">
            <div class="image-preview-card">
                <img id="previewImage4" class="preview-img">
                <small class="preview-label">Image 4</small>
            </div>
        </div>
    </div>
</div>
